<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brace</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a9d4f5; font-family: system-ui, sans-serif; }
    #game canvas { display: block; }
    /* Caixa de informação por cima do jogo */
    #info { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 6px;
            background: rgba(0,0,0,.6); color: #fff; font-size: 14px; pointer-events: none; }
    /* Os outros módulos do jogo (construção, desastre) põem os seus botões aqui */
    #hud { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  </style>
  <!-- Diz ao navegador onde está o Three.js (versão fixa) -->
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="info">Drag to rotate · Right-drag to move · Scroll to zoom · Click a tile</div>
  <div id="hud"></div>
  <script type="module" src="src/render/main.js"></script>
  <script type="module" src="src/render/disasterPlayer.js"></script>
</body>
</html>
