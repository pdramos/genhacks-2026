<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Same Night</title>
  <!-- Sem ícone de separador por agora (evita o erro 404 do favicon.ico na consola) -->
  <link rel="icon" href="data:,">
  <!-- Tipo de letra "Fredoka" (Google Fonts), redondo e com ar de jogo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <!-- A carta de erro tem de aparecer mesmo que o hud.css falhe: um estilo mínimo aqui.
       :where() tem especificidade 0, por isso o hud.css (mais abaixo) manda quando carrega. -->
  <style>
    :where(#fatal) { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 99;
      max-width: 90vw; width: 420px; padding: 20px; background: #fff6e5; border: 4px solid #3b2a1a;
      border-radius: 20px; font-family: system-ui, sans-serif; }
    :where(#fatal[hidden]) { display: none; }
  </style>
  <!-- O aspeto de toda a interface (barra de cima, cartas, botões, mensagens) -->
  <link rel="stylesheet" href="src/render/ui/hud.css">
  <!-- O questionário dos testes com jogadores (só aparece com ?playtest=1) -->
  <link rel="stylesheet" href="src/render/ui/quiz.css">
  <!-- Diz ao navegador onde está o Three.js (versão fixa) -->
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    } }
  </script>
</head>
<body data-phase="build">
  <div id="game"></div>

  <!-- Barra de cima: nome do nível, vento (só no desastre), moedas e botão do som.
       Fica aqui no HTML para existir logo, antes de qualquer script correr. -->
  <header id="topbar" class="topbar">
    <div class="level-badge">
      <span class="level-kicker">Level</span>
      <span id="level-name" class="level-name"></span>
    </div>
    <!-- A bússola do vento. Camadas, de baixo para cima: o mostrador (roda com a câmara),
         a seta do vento (das linhas de rajada, de onde o vento vem, até à ponta, para onde vai)
         e o anel com as letras N, E, S, W (roda com o mostrador, mas as letras ficam direitas). -->
    <div id="wind" class="wind-chip" role="group" hidden>
      <div class="compass">
        <div id="wind-dial" class="compass-dial"></div>
        <div id="wind-arrow" class="compass-arrow"></div>
        <div class="compass-ring" aria-hidden="true">
          <span class="compass-letter compass-north">N</span>
          <span class="compass-letter compass-east">E</span>
          <span class="compass-letter compass-south">S</span>
          <span class="compass-letter compass-west">W</span>
        </div>
      </div>
      <div class="wind-words">
        <span class="wind-label">Wind</span>
        <span class="wind-main"><b id="wind-from" class="wind-from"></b> <span id="wind-to" class="wind-to"></span></span>
        <span id="wind-details" class="wind-details"></span>
      </div>
    </div>
    <div class="topbar-right">
      <div id="budget" class="coin-counter" title="Budget left">
        <span id="budget-coin" class="coin"></span>
        <span id="budget-value" class="budget-value"></span>
      </div>
      <!-- O módulo de som liga-se a este botão (id "sound-toggle"). -->
      <button id="sound-toggle" class="round-button" type="button" aria-pressed="false" title="Mute sound" aria-label="Mute sound">
        <svg class="sound-on" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 18h8l10-9v30l-10-9H8z" fill="#fff6e5" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <path d="M32 17c3 3.5 3 10.5 0 14M37 12c6 6 6 18 0 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
        <svg class="sound-off" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 18h8l10-9v30l-10-9H8z" fill="#fff6e5" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <path d="M33 18l10 12M43 18L33 30" fill="none" stroke="#e8452c" stroke-width="3.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="info">WASD to move · Q/E to turn · Drag to rotate · Scroll to zoom · Click a tile</div>
  <!-- Os outros módulos do jogo (construção, desastre) põem os seus botões aqui -->
  <div id="hud"></div>

  <!-- A carta de erro: escondida, só aparece se o jogo NÃO conseguir arrancar.
       Sem ela, um jurado com um computador sem 3D via só uma página vazia. -->
  <div id="fatal" class="result-card fatal-card" role="alert" hidden>
    <div class="result-title"></div>
    <p class="fatal-text"></p>
    <div class="result-buttons">
      <a class="result-button fatal-link" href="https://github.com/pdramos/genhacks-2026#readme" target="_blank" rel="noopener noreferrer">Screenshots (on GitHub)</a>
      <button type="button" class="result-button" onclick="location.reload()">Reload</button>
    </div>
  </div>
  <!-- Um script NORMAL (não é módulo): corre mesmo que o Three.js não descarregue.
       Vigia o arranque e mostra a carta de erro com a explicação certa. -->
  <script>
    (function () {
      var started = false;  // o main.js chama markGameStarted() quando desenha o 1.º quadro
      var shown = null;     // a carta que está à vista: 'webgl', 'old' ou 'load'
      var errorTimer = null, stallTimer = null;
      var MESSAGES = {
        webgl: ["Your browser can't run 3D",
          'Same Night needs 3D graphics (WebGL), and this browser has them turned off or blocked. '
          + 'Try Chrome or Edge on a computer. In Settings, then System, turn on '
          + '"Use graphics acceleration when available" and restart the browser. '
          + 'Very old computers may not have 3D at all.'],
        old: ['Your browser is too old',
          'Same Night needs a recent browser. Update it, or try a recent Chrome, Edge, Firefox or Safari.'],
        load: ['The game could not load',
          'Part of the game did not download. Check your internet and reload the page. '
          + 'On a school or work network, try another network: some block the site the game '
          + 'downloads its 3D engine from.'],
      };
      // Se várias coisas falham, mostra a causa mais "funda": sem 3D > browser antigo > download.
      var PRIORITY = { load: 1, old: 2, webgl: 3 };
      window.markGameStarted = function () {
        started = true;
        clearTimeout(errorTimer);
        clearTimeout(stallTimer);
        // Num portátil lento, a carta "could not load" pode ter aparecido antes de o jogo
        // arrancar. Se afinal arrancou, a carta sai.
        document.getElementById('fatal').hidden = true;
        document.body.classList.remove('fatal');
      };
      window.showFatalCard = function (kind) {
        if (started) return; // o jogo já está a correr: um erro depois disto não é "não arrancou"
        if (shown && PRIORITY[shown] >= PRIORITY[kind]) return;
        shown = kind;
        var card = document.getElementById('fatal');
        card.querySelector('.result-title').textContent = MESSAGES[kind][0];
        card.querySelector('.fatal-text').textContent = MESSAGES[kind][1];
        card.hidden = false;
        document.body.classList.add('fatal'); // esconde a barra de cima e a dica, que ficavam vazias
      };
      // 1) Este browser consegue desenhar 3D? O Three.js 0.186 só usa WebGL2, por isso a
      // pergunta é a mesma. O contexto de teste é libertado logo (o browser tem poucos).
      function hasWebGL2() {
        try {
          var gl = document.createElement('canvas').getContext('webgl2');
          if (!gl) return false;
          var lose = gl.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
          return true;
        } catch (e) {
          return false;
        }
      }
      if (!hasWebGL2()) window.showFatalCard('webgl');
      // 2) Browser antigo: não percebe o "importmap" (o sítio de onde vem o Three.js).
      if (window.HTMLScriptElement && HTMLScriptElement.supports && !HTMLScriptElement.supports('importmap')) {
        window.showFatalCard('old');
      }
      // 3) Um erro antes de o jogo arrancar:
      //    - fala de WebGL -> sem 3D; fala de "specifier" -> browser antigo (mostra já);
      //    - vem do main.js -> o jogo parou de vez (mostra já);
      //    - outro erro qualquer pode não impedir o jogo: espera 10 s e só então avisa.
      // (Só "WebGL": a palavra "context" também aparece em erros do som, o AudioContext.)
      function onEarlyError(message, file) {
        if (started) return;
        if (/webgl/i.test(message)) return window.showFatalCard('webgl');
        if (/specifier|does not resolve/i.test(message)) return window.showFatalCard('old');
        if (/\/src\/render\/main\.js$/.test(file || '')) return window.showFatalCard('load');
        // Um módulo do jogo (ex.: o estilo 3D) não descarregou: o jogo não vai arrancar.
        // (Chrome: "dynamically imported module"; Safari: "Importing a module script failed".)
        if (/dynamically imported module|importing a module script failed/i.test(message)) {
          return window.showFatalCard('load');
        }
        if (!errorTimer) errorTimer = setTimeout(function () { window.showFatalCard('load'); }, 10000);
      }
      window.addEventListener('error', function (event) { onEarlyError(String(event.message || ''), event.filename); });
      window.addEventListener('unhandledrejection', function (event) {
        onEarlyError(String((event.reason && event.reason.message) || event.reason || ''));
      });
      // 4) Um download pendurado (não falha, só nunca acaba) não dá erro nenhum. Por isso há um
      // vigia: 25 s com a página À VISTA sem o jogo arrancar -> "could not load". Num separador
      // escondido o relógio não conta (lá o browser também não desenha).
      function armStallWatch() {
        if (started || stallTimer || document.visibilityState !== 'visible') return;
        stallTimer = setTimeout(function () { window.showFatalCard('load'); }, 25000);
      }
      armStallWatch();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') armStallWatch();
        else { clearTimeout(stallTimer); stallTimer = null; }
      });
    })();
  </script>

  <!-- onerror: o módulo (ou o Three.js que ele importa) não descarregou -->
  <script type="module" src="src/render/main.js" onerror="showFatalCard('load')"></script>
  <script type="module" src="src/render/buildPanel.js"></script>
  <script type="module" src="src/render/disasterPlayer.js"></script>
  <script type="module" src="src/render/audioHooks.js"></script>
  <script type="module" src="src/render/keyboardCamera.js"></script>
  <script type="module" src="src/render/ui/quiz.js"></script>
</body>
</html>
