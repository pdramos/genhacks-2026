<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brace</title>
  <!-- Sem ícone de separador por agora (evita o erro 404 do favicon.ico na consola) -->
  <link rel="icon" href="data:,">
  <!-- Tipo de letra "Fredoka" (Google Fonts), redondo e com ar de jogo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <!-- O aspeto de toda a interface (barra de cima, cartas, botões, mensagens) -->
  <link rel="stylesheet" href="src/render/ui/hud.css">
  <!-- Diz ao navegador onde está o Three.js (versão fixa) -->
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    } }
  </script>
</head>
<body data-phase="build">
  <div id="game"></div>

  <!-- Barra de cima: nome do nível, vento (só no desastre), moedas e botão do som.
       Fica aqui no HTML para existir logo, antes de qualquer script correr. -->
  <header id="topbar" class="topbar">
    <div class="level-badge">
      <span class="level-kicker">Level</span>
      <span id="level-name" class="level-name"></span>
    </div>
    <div id="wind" class="wind-chip" hidden>
      <div class="compass">
        <div id="wind-dial" class="compass-dial"><span class="compass-north">N</span></div>
        <div id="wind-arrow" class="compass-arrow"></div>
      </div>
      <div class="wind-words">
        <span class="wind-label">Wind</span>
        <span id="wind-text" class="wind-text"></span>
      </div>
    </div>
    <div class="topbar-right">
      <div id="budget" class="coin-counter" title="Budget left">
        <span id="budget-coin" class="coin"></span>
        <span id="budget-value" class="budget-value"></span>
      </div>
      <!-- O módulo de som liga-se a este botão (id "sound-toggle"). -->
      <button id="sound-toggle" class="round-button" type="button" aria-pressed="false" title="Mute sound" aria-label="Mute sound">
        <svg class="sound-on" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 18h8l10-9v30l-10-9H8z" fill="#fff6e5" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <path d="M32 17c3 3.5 3 10.5 0 14M37 12c6 6 6 18 0 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
        <svg class="sound-off" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 18h8l10-9v30l-10-9H8z" fill="#fff6e5" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <path d="M33 18l10 12M43 18L33 30" fill="none" stroke="#e8452c" stroke-width="3.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="info">WASD to move · Q/E to turn · Drag to rotate · Scroll to zoom · Click a tile</div>
  <!-- Os outros módulos do jogo (construção, desastre) põem os seus botões aqui -->
  <div id="hud"></div>

  <script type="module" src="src/render/main.js"></script>
  <script type="module" src="src/render/buildPanel.js"></script>
  <script type="module" src="src/render/disasterPlayer.js"></script>
  <script type="module" src="src/render/audioHooks.js"></script>
  <script type="module" src="src/render/keyboardCamera.js"></script>
</body>
</html>
